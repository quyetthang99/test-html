    };

    window.startEditShape = function(layerId) {
        var layer = drawnItems.getLayer(layerId);
        if (!layer) return;
        map.closePopup();

        if (layer.editing) {
            layer.editing.enable();
            window.editingLayerId = layerId;
            
            var hint = document.getElementById('draw-hint');
            hint.style.display = 'block';
            hint.innerHTML = `🛠️ <b>Sửa Mốc Dây:</b> Nhấn giữ và kéo các ô vuông để nắn dây.<br><button onclick="saveEditShape()" style="margin-top:8px; padding:6px 20px; background:#16a34a; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:14px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">💾 LƯU LẠI</button>`;
        }
    };

    window.saveEditShape = function() {
        if (window.editingLayerId) {
            var layer = drawnItems.getLayer(window.editingLayerId);
            if (layer && layer.editing) {
                layer.editing.disable();
                
                let latlngs = layer.getLatLngs(); let dist = 0;
                if (latlngs.length > 0 && !Array.isArray(latlngs[0])) {
                    for(let i=0; i<latlngs.length-1; i++) dist += map.distance(latlngs[i], latlngs[i+1]);
                    if(!layer.options.customData) layer.options.customData = {};
                    layer.options.customData.length = dist; 
                }
                updatePopupContent(layer);
                autoSaveToCloud(true, "Đã cập nhật hình dáng dây!");
            }
            window.editingLayerId = null;
            document.getElementById('draw-hint').style.display = 'none';
        }
    };

    window.editLayerData = function(layerId, isNew = false) {
        var layer = drawnItems.getLayer(layerId); if(!layer) return;
        var meta = layer.options.metadata || {}; var custom = layer.options.customData || {};
        
        meta.name = meta.name || ''; meta.info = meta.info || ''; 
        meta.tram = meta.tram || ''; meta.img = meta.img || ''; 
        if(!meta.maLienKet) meta.maLienKet = generateId(); 

        var form = `
            <div class="popup-form">
                <h3>${isNew ? `Thêm Mới: ${custom.title || ''}` : `Sửa Thông Tin`}</h3>
                <input type="text" id="p-name-${layerId}" value="${meta.name}" placeholder="Tên thiết bị (hiện dưới icon)">
                <input type="text" id="p-info-${layerId}" value="${meta.info}" placeholder="Chức năng / Thông số kỹ thuật">
                <input type="text" id="p-tram-${layerId}" value="${meta.tram}" placeholder="Thuộc trạm (VD: Trạm Thôn Vinh)">
                <input type="text" id="p-img-${layerId}" value="${meta.img}" placeholder="Dán Link Ảnh / Link Drive">
                <input type="text" id="p-ma-${layerId}" value="${meta.maLienKet}" placeholder="Mã LK (Tự sinh)" style="background:#f8fafc; font-size:12px; color:#64748b;" readonly title="Mã liên kết tự động sinh ra">
                <button class="btn-save" onclick="saveEditData(${layerId})">💾 Lưu Thông Tin</button>
            </div>`;
        if(isNew) layer.bindPopup(form).openPopup(); else layer.setPopupContent(form);
    };

    window.saveEditData = function(layerId) {
        var layer = drawnItems.getLayer(layerId); if(!layer) return;
        let newName = document.getElementById(`p-name-${layerId}`).value || 'Thiết bị';
        let newTram = document.getElementById(`p-tram-${layerId}`).value || '';
        
        layer.options.metadata = { 
            name: newName, 
            info: document.getElementById(`p-info-${layerId}`).value || '', 
            tram: newTram,
            img: document.getElementById(`p-img-${layerId}`).value || '',
            maLienKet: document.getElementById(`p-ma-${layerId}`).value || ''
        };
        
        if (layer instanceof L.Marker && layer.options.customData && layer.options.customData.type) { layer.setIcon(getCustomIcon(layer.options.customData.type, newName)); }
        updatePopupContent(layer);
        
        let tramKey = newTram.trim() === '' ? 'Chưa phân trạm' : newTram.trim();
        updateStationFilterUI(tramKey); 
        
        autoSaveToCloud(); 
    };

    window.deleteLayerQuick = function(layerId) { 
        if(confirm("Xóa đối tượng này khỏi bản đồ?")) { 
            var layer = drawnItems.getLayer(layerId); 
            if(layer) {
                map.closePopup(); 
                drawnItems.removeLayer(layer); 
                updateStationFilterUI(); 
                autoSaveToCloud(); 
            }
        } 
    };

    function updatePopupContent(layer) {
        var meta = layer.options.metadata || {}; var custom = layer.options.customData || {}; var layerId = L.stamp(layer);
        var content = `<div class="popup-form"><h3>${custom.title || ''} - ${meta.name || ''}</h3>`;
        
        if (custom.length !== undefined) {
            content += `<div style="background:#e0f2fe; color:#0369a1; padding:6px; border-radius:4px; font-size:13px; font-weight:bold; margin-bottom:8px; text-align:center; border: 1px dashed #0284c7;">📏 Chiều dài: ${formatDistance(custom.length)}</div>`;
        }

        if (meta.info) content += `<p style="margin:5px 0;"><b>Thông số:</b> ${meta.info}</p>`;
        if (meta.maLienKet) content += `<p style="margin:5px 0; font-size:12px; color:#475569;"><b>🔗 Mã LK:</b> ${meta.maLienKet}</p>`;
        if (meta.tram) content += `<p style="margin:5px 0;"><b>🏢 Trạm:</b> <span style="color:#b45309; font-weight:bold;">${meta.tram}</span></p>`;

        var imgStr = meta.img ? meta.img.toString().trim() : '';
        if (imgStr.includes('drive.google.com') && imgStr.includes('/folders/')) {
            content += `<a href="${imgStr}" target="_blank" class="btn-folder">📂 Mở thư mục ảnh (Google Drive)</a>`;
        } else {
            var imgArr = imgStr.split(',').map(s => fixGoogleDriveLink(s)).filter(s => s);
            if(imgArr.length > 0) {
                var safeArr = encodeURIComponent(JSON.stringify(imgArr));
                content += `<img src="${imgArr[0]}" class="popup-img" title="Click để xem" onclick="openGallery('${safeArr}')" onerror="this.style.display='none'">`;
                if(imgArr.length > 1) { content += `<div class="img-count-badge">📷 Có ${imgArr.length} ảnh. Click vào ảnh để xem toàn bộ.</div>`; }
            }
        }
        
        let moveBtn = (layer instanceof L.Marker) ? `<button class="btn-move" onclick="startMoveLayer(${layerId})">📍 Dời cột</button>` : '';
        let lineBtns = (layer instanceof L.Polyline && !(layer instanceof L.Polygon)) ? 
            `<button class="btn-continue" onclick="continueLine(${layerId})">🔗 Vẽ tiếp</button>
             <button class="btn-edit-shape" onclick="startEditShape(${layerId})">🛠️ Sửa mốc</button>` : '';
        
        content += `<div class="action-btns">
            ${moveBtn}
            ${lineBtns}
            <button class="btn-edit" onclick="editLayerData(${layerId})">✏️ Sửa TT</button>
            <button class="btn-delete" onclick="deleteLayerQuick(${layerId})">🗑️ Xóa</button>
        </div></div>`;
        
        layer.bindPopup(content); if(layer.isPopupOpen()) layer.setPopupContent(content);
    }

    window.openGallery = function(safeArrStr) {
        var arr = JSON.parse(decodeURIComponent(safeArrStr)); document.getElementById('gallery-modal').classList.add('show');
        var mainImg = document.getElementById('main-gallery-img'); var strip = document.getElementById('thumb-strip'); strip.innerHTML = '';
        arr.forEach((src, idx) => {
            let img = document.createElement('img'); img.src = src; img.className = 'thumb-img' + (idx === 0 ? ' active' : '');
            img.onclick = function() { mainImg.src = src; document.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active')); img.classList.add('active'); };
            strip.appendChild(img);
        }); mainImg.src = arr[0];
    };
    window.closeGallery = function() { document.getElementById('gallery-modal').classList.remove('show'); document.getElementById('main-gallery-img').src = ''; };

    // ==========================================
    // LOGIC: LỌC TRẠM THÔNG MINH & TÌM KIẾM TRẠM
    // ==========================================
    function getCheckedStations() {
        let checkboxes = document.querySelectorAll('.station-cb');
        let checked = [];
        checkboxes.forEach(cb => { if(cb.checked) checked.push(cb.value); });
        return checked;
    }

    function filterStationList() {
        let kw = (document.getElementById('station-search').value || '').toLowerCase().trim();
        let labels = document.querySelectorAll('#station-filter-list .station-label');
        labels.forEach(lb => {
            let text = lb.textContent.toLowerCase();
            lb.style.display = text.includes(kw) ? 'flex' : 'none';
        });
    }

    function toggleAllStations(isCheck) {
        // Chỉ bật/tắt các trạm đang hiển thị trong kết quả tìm kiếm
        let labels = document.querySelectorAll('#station-filter-list .station-label');
        labels.forEach(lb => {
            if (lb.style.display !== 'none') {
                let cb = lb.querySelector('.station-cb');
                if (cb) cb.checked = isCheck;
            }
        });
        applyStationFilter();
    }

    function updateStationFilterUI(forceCheckStation = null) {
        let currentChecked = getCheckedStations(); 
        let stations = new Set();
        
        const collectStation = layer => {
            let tram = (layer.options.metadata && layer.options.metadata.tram) ? layer.options.metadata.tram.trim() : '';
            stations.add(tram === '' ? 'Chưa phân trạm' : tram);
        };

        drawnItems.eachLayer(collectStation);
        hiddenItems.eachLayer(collectStation);

        let stationArray = Array.from(stations).sort();
        let listContainer = document.getElementById('station-filter-list');
        listContainer.innerHTML = '';

        let isFirstLoad = (currentChecked.length === 0 && document.querySelectorAll('.station-cb').length === 0);

        stationArray.forEach(tram => {
            let isChecked = isFirstLoad || currentChecked.includes(tram) || tram === forceCheckStation;
            
            let label = document.createElement('label');
            label.className = 'station-label';
            
            let cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'station-cb';
            cb.value = tram;
            cb.checked = isChecked;
            cb.onchange = applyStationFilter;

            label.appendChild(cb);
            label.appendChild(document.createTextNode(tram));
            listContainer.appendChild(label);
        });

        filterStationList(); // Giữ bộ lọc chữ nếu người dùng đang gõ tìm kiếm
        applyStationFilter(); 
    }

    function applyStationFilter() {
        let checkedStations = getCheckedStations();
        
        let toHide = [];
        drawnItems.eachLayer(layer => {
            let tram = (layer.options.metadata && layer.options.metadata.tram) ? layer.options.metadata.tram.trim() : '';
            if (tram === '') tram = 'Chưa phân trạm';

            if (!checkedStations.includes(tram)) {
                toHide.push(layer);
            }
        });
        toHide.forEach(layer => {
            if (layer.isPopupOpen()) layer.closePopup();
            drawnItems.removeLayer(layer);
            hiddenItems.addLayer(layer);
        });

        let toShow = [];
        hiddenItems.eachLayer(layer => {
            let tram = (layer.options.metadata && layer.options.metadata.tram) ? layer.options.metadata.tram.trim() : '';
            if (tram === '') tram = 'Chưa phân trạm';

            if (checkedStations.includes(tram)) {
                toShow.push(layer);
            }
        });
        toShow.forEach(layer => {
            hiddenItems.removeLayer(layer);
            drawnItems.addLayer(layer);
        });
    }

    map.on('moveend', applyStationFilter);
    map.on('zoomend', applyStationFilter);

    // ==========================================
    // KẾT NỐI FIREBASE REALTIME DATABASE
    // ==========================================
    const FIREBASE_URL = 'https://luoi-dien-van-ban-default-rtdb.asia-southeast1.firebasedatabase.app/dulieu.json';

    function autoLoadFromCloud() {
        if (FIREBASE_URL.includes("DÁN-LINK")) {
            console.log("Bạn chưa cấu hình link Firebase."); return;
        }

        var hint = document.getElementById('draw-hint');
        hint.style.display = 'block'; hint.innerHTML = "⏳ Đang tải dữ liệu lưới điện từ Firebase...";
        
        fetch(FIREBASE_URL)
        .then(response => response.json())
        .then(res => {
            hint.style.display = 'none';
            if (!res || !res.features) return; 
            
            drawnItems.clearLayers();
            hiddenItems.clearLayers();
            L.geoJSON(res, {
                pointToLayer: function(feature, latlng) {
                    let custom = feature.properties.customData || {}; let type = custom.type || 'tba'; let meta = feature.properties.metadata || {}; return L.marker(latlng, { icon: getCustomIcon(type, meta.name || '') });
                },
                style: function(feature) {
                    let custom = feature.properties.customData || {}; let style = { weight: 4, color: custom.color || '#3388ff' };
                    if(custom.dash) style.dashArray = custom.dash; return style;
                },
                onEachFeature: function (feature, layer) {
                    layer.options.metadata = feature.properties.metadata || {}; 
                    layer.options.customData = feature.properties.customData || { type: 'tba', title: 'Thiết bị cũ' };
                    if(!layer.options.metadata.maLienKet) layer.options.metadata.maLienKet = generateId();
                    drawnItems.addLayer(layer); updatePopupContent(layer); 
                }
            });
            if (drawnItems.getLayers().length > 0) map.fitBounds(drawnItems.getBounds(), {padding: [50, 50]});
            
            updateStationFilterUI();
        })
        .catch(err => {
            hint.style.display = 'none';
            console.error("Lỗi tải dữ liệu Firebase:", err);
        });
    }

    function autoSaveToCloud(showSuccessAlert = false, customMsg = "") {
        if (FIREBASE_URL.includes("DÁN-LINK")) return; 

        var hint = document.getElementById('draw-hint');
        hint.style.display = 'block'; hint.innerHTML = "💾 Đang đồng bộ lên Firebase...";

        var data = { type: "FeatureCollection", features: [] };

        const processSave = function(layer) {
            if (layer.toGeoJSON) {
                var geo = layer.toGeoJSON();
                geo.properties = { metadata: layer.options.metadata, customData: layer.options.customData };
                data.features.push(geo);
            }
        };

        drawnItems.eachLayer(processSave);
        hiddenItems.eachLayer(processSave);

        fetch(FIREBASE_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (!response.ok) throw new Error('Lỗi từ Firebase Database');
            return response.json();
        })
        .then(res => {
            hint.style.display = 'none';
            if (showSuccessAlert) alert("✅ " + (customMsg || "Đã đồng bộ thành công!"));
        })
        .catch(err => {
            hint.style.display = 'none';
            console.error("Lỗi lưu dữ liệu:", err);
            alert("❌ Lỗi đồng bộ máy chủ Firebase!\nKiểm tra lại kết nối mạng của bạn.");
        });
    }

    window.onload = autoLoadFromCloud;

    // ==========================================
    // NHẬP XUẤT EXCEL
    // ==========================================
    function parseCoordStr(str) {
        if (!str) return null; let s = str.toString().replace(/,/g, '.').trim(); let val = parseFloat(s); if (isNaN(val)) return null;
        if (val > 1000) { let sNum = val.toString().replace('.', ''); if (sNum.startsWith('10')) return parseFloat(sNum.substring(0, 3) + '.' + sNum.substring(3)); else return parseFloat(sNum.substring(0, 2) + '.' + sNum.substring(2)); }
        return val;
    }

    function importFromExcel(event) {
        let file = event.target.files[0]; if (!file) return; let reader = new FileReader();
        reader.onload = function(e) {
            let data = new Uint8Array(e.target.result); let workbook = XLSX.read(data, {type: 'array'});
            let json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]); let count = 0;
            json.forEach(row => {
                let getVal = (kws) => { let key = Object.keys(row).find(k => kws.some(kw => k.toLowerCase().includes(kw))); return key ? row[key] : null; };
                
                let ten = getVal(['tên', 'name']) || ''; 
                let rawLat = getVal(['lat', 'vĩ', 'y']); 
                let rawLong = getVal(['long', 'lng', 'kinh', 'x']); 
                let chucNang = getVal(['chức', 'loại', 'type']) || ''; 
                let dAnh = getVal(['ảnh', 'image', 'img', 'link', 'hinh']) || '';
                
                let maLienKet = getVal(['mã', 'ma', 'liên kết', 'id']) || generateId(); 
                let tenTram = getVal(['trạm', 'tram', 'station']) || '';

                if (rawLong && rawLat) {
                    let c1 = parseCoordStr(rawLong); let c2 = parseCoordStr(rawLat);
                    let realLat = (c1 > 10 && c1 < 25) ? c1 : ((c2 > 10 && c2 < 25) ? c2 : null);
                    let realLng = (c1 > 100 && c1 < 110) ? c1 : ((c2 > 100 && c2 < 110) ? c2 : null);

                    if (realLat && realLng) {
                        let type = 'ctt'; let title = 'Cột trung thế'; let cLow = chucNang.toString().toLowerCase();
                        if (cLow.includes('trạm') || cLow.includes('tba')) { type = 'tba'; title = 'Trạm biến áp'; } else if (cLow.includes('hạ')) { type = 'cht'; title = 'Cột hạ thế'; }
                        
                        let marker = L.marker([realLat, realLng], { icon: getCustomIcon(type, ten) }).addTo(drawnItems);
                        marker.options.customData = { type: type, title: title }; 
                        marker.options.metadata = { name: ten || 'Trạm/Cột mới', info: chucNang, img: dAnh, tram: tenTram, maLienKet: maLienKet };
                        updatePopupContent(marker); count++;
                    }
                }
            });
            if (drawnItems.getLayers().length > 0) map.fitBounds(drawnItems.getBounds(), {padding: [50, 50]});
            
            updateStationFilterUI();
            autoSaveToCloud(true, `Đã nạp thành công ${count} thiết bị từ Excel và đồng bộ lên Firebase!`);
        };
        reader.readAsArrayBuffer(file); event.target.value = ''; 
    }

    function exportToExcel() {
        // CHỈ XUẤT NHỮNG THIẾT BỊ ĐANG HIỂN THỊ TRÊN BẢN ĐỒ (drawnItems)
        if (drawnItems.getLayers().length === 0) { 
            alert("Không có dữ liệu nào đang hiển thị để xuất! Hãy bật hiển thị ít nhất 1 Trạm ở thanh menu bên trái."); 
            return; 
        }
        let excelData = [];
        
        const processExcel = function(layer) {
            let meta = layer.options.metadata || {}; 
            let custom = layer.options.customData || {};
            let lat = '', lng = '';
            
            if (layer instanceof L.Marker) {
                lat = layer.getLatLng().lat.toFixed(8); 
                lng = layer.getLatLng().lng.toFixed(8);
            } else if (layer instanceof L.Polyline && layer.getLatLngs) {
                let pts = layer.getLatLngs();
                if(pts.length > 0 && !Array.isArray(pts[0])) { 
                    lat = pts[0].lat.toFixed(8); 
                    lng = pts[0].lng.toFixed(8); 
                } 
                else if (pts.length > 0 && Array.isArray(pts[0]) && pts[0].length > 0) { 
                    lat = pts[0][0].lat.toFixed(8); 
                    lng = pts[0][0].lng.toFixed(8); 
                }
            }

            excelData.push({
                "tên": meta.name || '',
                "lat": lat,
                "long": lng,
                "chức năng": meta.info || custom.title || '',
                "link": meta.img || '',
                "mã liên kết": meta.maLienKet || '',
                "trạm": meta.tram || ''
            });
        };

        // Chỉ lặp qua drawnItems, loại bỏ hiddenItems
        drawnItems.eachLayer(processExcel);

        try {
            let ws = XLSX.utils.json_to_sheet(excelData);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            XLSX.writeFile(wb, "DuLieu_DienLuc_Xuat.xlsx");
        } catch(err) { 
            alert("Có lỗi khi xuất file Excel: " + err.message); 
        }
    }
</script>
